name: Release desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate tag version against Cargo.toml
        id: check-version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '/^\[workspace\.package\]/{flag=1;next}/^\[/{flag=0}flag && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "Could not determine [workspace.package] version from Cargo.toml." >&2
            exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag version $tag_version does not match Cargo.toml version $cargo_version." >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin baseapp --target ${{ matrix.target }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $staging = "release/staging/baseapp-$version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/baseapp.exe" "$staging/baseapp.exe"
          Copy-Item "LICENSE" "$staging/LICENSE"
          Compress-Archive -Path "$staging/*" -DestinationPath "release/baseapp-$version-${{ matrix.platform }}.zip" -Force

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          archive_dir="baseapp-${version}-${{ matrix.platform }}"
          mkdir -p "release/staging/${archive_dir}"
          cp "target/${{ matrix.target }}/release/baseapp" "release/staging/${archive_dir}/baseapp"
          cp "LICENSE" "release/staging/${archive_dir}/LICENSE"
          chmod +x "release/staging/${archive_dir}/baseapp"
          tar -C release/staging -czf "release/baseapp-${version}-${{ matrix.platform }}.tar.gz" "${archive_dir}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/baseapp-*.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish-release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum baseapp-* > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          files: |
            release/baseapp-*.zip
            release/baseapp-*.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
